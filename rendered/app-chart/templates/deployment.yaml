apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-chart.fullname" . }}
  labels:
    app: {{ include "app-chart.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "app-chart.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "app-chart.name" . }}
    spec:
# BEGIN custom-block: deployment-initcontainers-include
      initContainers:
        {{- include "app.custom.initContainers" . | nindent 8 }}
# END custom-block: deployment-initcontainers-include
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: APP_ENV
              value: "foo"
            - name: APP_MODE
              value: "production"
            - name: CUSTOM_INJECTED
              value: "true"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: WORKER_ENV
              value: "bar"
# BEGIN custom-block: deployment-worker-extra-env-from-yaml-file
{{- include "app.custom.extraEnvItems.worker" . | nindent 12 }}
# END custom-block: deployment-worker-extra-env-from-yaml-file
            - name: WORKER_MODE
              value: "async"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
